<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Recipe Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    
    <div style ="background-color: #41973e; text-align: center; padding: 0px; padding-left: 0; padding-right: 0;">
      <img src="Logo.jpg" alt="Banner Image" width="250">
    </div>
    <button id="userIcon" class="absolute top-4 right-4 p-2 text-gray-600 hover:text-gray-900" title="Login">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="currentColor" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
      </svg>
    </button>

    <script>
      // Redirect to login.html when user icon is clicked
      document.getElementById('userIcon').addEventListener('click', () => {
      window.location.href = 'login.html';
      });
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </header>
  
  <!-- Welcome message for logged-in users -->
  <div id="welcomeMessage" style="display: none; background-color: #4CAF50; color: white; padding: 10px; text-align: center; margin-bottom: 20px;">
    Welcome back, <span id="userName"></span>!
  </div>
  
  <form id="recipeForm">
    <label>Ingredients:</label>
    <input type="text" id="ingredients" required />

    <label>Dietary Needs:</label>
    <input type="text" id="dietary" required />

    <button type="submit">Get Recipe</button>
  </form>

  <div id="output"></div>

  <script>
    const form = document.getElementById('recipeForm');
    const output = document.getElementById('output');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ingredients = document.getElementById('ingredients').value;
      const dietary = document.getElementById('dietary').value;

      const response = await fetch('http://localhost:5000/get-recipe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ingredients, dietary }),
      });

      const data = await response.json();
      output.innerText = data.recipe || "No recipe found.";
    });
  </script>

  <script>
    // Add Google Sign-In initialization for index.html
    const GOOGLE_CLIENT_ID = '702852647652-2a1a7uv3e8m1rfurrinvo43n2q59q8vn.apps.googleusercontent.com';
    
    function initializeGoogleSignInForIndex() {
        if (typeof google !== 'undefined' && google.accounts) {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: (response) => {
                    // Handle sign-in on index page if needed
                    console.log('Google Sign-In on index page:', response);
                }
            });
        }
    }
    
     // Parse JWT token (client-side parsing for display purposes only)
  function parseJwt(token) {
    try {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(
        atob(base64)
          .split('')
          .map((c) => {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          })
          .join('')
      );
      return JSON.parse(jsonPayload);
    } catch (error) {
      console.error('Error parsing JWT:', error);
      return null;
    }
  }

    // Handle Google Sign-In redirect and show welcome message
    window.addEventListener('load', () => {
  // Google returns credential in URL fragment: #id_token=...
  const fragment = new URLSearchParams(window.location.hash.substring(1));
  const idToken = fragment.get('id_token');

  if (idToken) {
    const userInfo = parseJwt(idToken);

    // Display user info
    document.getElementById('welcomeMessage').style.display = 'block';
    document.getElementById('userName').textContent = userInfo.name;

    // Optionally store in localStorage
    localStorage.setItem('user', JSON.stringify(userInfo));

    // Clean up the URL
    setTimeout(() => {
      window.history.replaceState({}, document.title, window.location.pathname);
    }, 1000);
  }

  // Optional: fallback to previously saved user
  if (!idToken && localStorage.getItem('user')) {
    const user = JSON.parse(localStorage.getItem('user'));
    document.getElementById('welcomeMessage').style.display = 'block';
    document.getElementById('userName').textContent = user.name;
  }
});

  </script>

</body>
</html>
